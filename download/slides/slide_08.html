<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>08 · Tiềm năng du lịch Nha Trang</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  .stat-card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px 24px; }
  .icon-circle { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  .stat-num { margin: 18px 0 0; font-family: var(--font-num); font-size: 60px; font-weight: 900; line-height: 1.05; letter-spacing: -1px; }
  .stat-label { margin: 12px 0 0; font-size: var(--fs-body); font-weight: 700; line-height: 1.3; color: var(--text-muted); }
</style>
</head>
<body>
<div class="slide" style="padding:60px 64px;display:flex;flex-direction:column;">

  <header style="flex:none;">
    <span class="chip-navy" style="font-size:var(--fs-small);">TIỀM NĂNG</span>
    <h1 style="margin:20px 0 0;font-family:var(--font-heading);font-size:var(--fs-h1);font-weight:900;line-height:1.12;color:var(--primary);">Điểm đến hút khách bậc nhất Việt Nam</h1>
    <div class="accent-bar" style="margin-top:18px;"></div>
  </header>

  <section style="flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px;margin-top:34px;">

    <!-- Thẻ 1: số liệu hero -->
    <div class="card-accent stat-card" style="background:#FFFFFF;">
      <div class="icon-circle" style="background:var(--accent-soft);">
        <span class="material-icons" style="font-size:34px;color:var(--accent-deep);">trending_up</span>
      </div>
      <div class="stat-num" style="color:var(--accent-deep);">16,4 triệu</div>
      <p class="stat-label">lượt khách đến Khánh Hòa năm 2025</p>
    </div>

    <!-- Thẻ 2 -->
    <div class="card-soft stat-card">
      <div class="icon-circle" style="background:var(--primary-soft);">
        <span class="material-icons" style="font-size:34px;color:var(--primary);">public</span>
      </div>
      <div class="stat-num" style="color:var(--primary);">5,5 triệu</div>
      <p class="stat-label">lượt khách quốc tế</p>
    </div>

    <!-- Thẻ 3 -->
    <div class="card-soft stat-card">
      <div class="icon-circle" style="background:var(--primary-soft);">
        <span class="material-icons" style="font-size:34px;color:var(--primary);">workspace_premium</span>
      </div>
      <div class="stat-num" style="color:var(--primary);">Top 29</div>
      <p class="stat-label">vịnh đẹp nhất thế giới</p>
    </div>

  </section>

  <footer style="flex:none;margin-top:20px;">
    <p style="margin:0;font-size:var(--fs-micro);color:var(--text-muted);">Nguồn: Hệ thống thống kê du lịch Việt Nam — 2025</p>
  </footer>

</div>
</body>
</html>
