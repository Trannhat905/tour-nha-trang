<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tổng quan tour — Thông tin tour</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#FFFFFF; overflow:hidden; }
  .material-icons { line-height:1; }
</style>
</head>
<body>
<div class="slide flex flex-col" style="padding:56px 64px;">

  <!-- Header -->
  <div class="shrink-0">
    <span class="chip" style="font-size:var(--fs-micro);">TỔNG QUAN</span>
    <h1 style="font-family:var(--font-heading); font-size:var(--fs-h1); font-weight:800; line-height:1.1; color:var(--primary); margin-top:18px;">Thông tin tour</h1>
    <div class="accent-bar" style="margin-top:16px;"></div>
  </div>

  <!-- Grid 2x2 -->
  <div class="grid grid-cols-2 gap-6 flex-1 min-h-0" style="margin-top:30px;">

    <!-- Card 1: Thời gian -->
    <div class="card-soft flex items-center" style="padding:0 34px; gap:24px;">
      <div class="flex items-center justify-center rounded-full shrink-0" style="width:72px; height:72px; background:var(--accent-soft);">
        <span class="material-icons" style="font-size:36px; color:var(--accent-deep);">schedule</span>
      </div>
      <div>
        <div style="font-size:var(--fs-small); font-weight:700; letter-spacing:2px; color:var(--text-muted);">THỜI GIAN</div>
        <div style="font-family:var(--font-heading); font-size:var(--fs-h3); font-weight:800; color:var(--primary); line-height:1.25; margin-top:6px;">3 ngày 2 đêm</div>
      </div>
    </div>

    <!-- Card 2: Di chuyển -->
    <div class="card-soft flex items-center" style="padding:0 34px; gap:24px;">
      <div class="flex items-center justify-center rounded-full shrink-0" style="width:72px; height:72px; background:var(--accent-soft);">
        <span class="material-icons" style="font-size:36px; color:var(--accent-deep);">directions_bus</span>
      </div>
      <div>
        <div style="font-size:var(--fs-small); font-weight:700; letter-spacing:2px; color:var(--text-muted);">DI CHUYỂN</div>
        <div style="font-family:var(--font-heading); font-size:var(--fs-h3); font-weight:800; color:var(--primary); line-height:1.25; margin-top:6px;">Xe giường nằm · Máy bay</div>
      </div>
    </div>

    <!-- Card 3: Đối tượng -->
    <div class="card-soft flex items-center" style="padding:0 34px; gap:24px;">
      <div class="flex items-center justify-center rounded-full shrink-0" style="width:72px; height:72px; background:var(--accent-soft);">
        <span class="material-icons" style="font-size:36px; color:var(--accent-deep);">groups</span>
      </div>
      <div>
        <div style="font-size:var(--fs-small); font-weight:700; letter-spacing:2px; color:var(--text-muted);">ĐỐI TƯỢNG</div>
        <div style="font-family:var(--font-heading); font-size:var(--fs-h3); font-weight:800; color:var(--primary); line-height:1.25; margin-top:6px;">Học sinh · Sinh viên · Nhóm bạn</div>
      </div>
    </div>

    <!-- Card 4: Trải nghiệm -->
    <div class="card-soft flex items-center" style="padding:0 34px; gap:24px;">
      <div class="flex items-center justify-center rounded-full shrink-0" style="width:72px; height:72px; background:var(--accent-soft);">
        <span class="material-icons" style="font-size:36px; color:var(--accent-deep);">beach_access</span>
      </div>
      <div>
        <div style="font-size:var(--fs-small); font-weight:700; letter-spacing:2px; color:var(--text-muted);">TRẢI NGHIỆM</div>
        <div style="font-family:var(--font-heading); font-size:var(--fs-h3); font-weight:800; color:var(--primary); line-height:1.25; margin-top:6px;">Biển đảo · Văn hóa · Ẩm thực</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
