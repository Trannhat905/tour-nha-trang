<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>07 · Phần 02 — Thực trạng du lịch Nha Trang</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
</style>
</head>
<body>
<div class="slide" style="background:var(--bg-soft);">

  <!-- Số chương khổng lồ mờ, góc phải (trang trí) -->
  <div data-decor aria-hidden="true" style="position:absolute;right:44px;top:50%;transform:translateY(-50%);z-index:1;font-family:var(--font-heading);font-weight:900;font-size:260px;line-height:1;color:var(--primary);opacity:0.08;user-select:none;">02</div>

  <!-- Khối nội dung căn giữa dọc -->
  <div style="position:absolute;left:72px;top:50%;transform:translateY(-50%);z-index:10;max-width:1030px;">
    <span class="chip" style="font-size:var(--fs-small);color:var(--primary);">PHẦN 02 / 04</span>
    <h1 style="margin:30px 0 0;font-family:var(--font-heading);font-size:var(--fs-display);font-weight:900;line-height:1.08;letter-spacing:-1px;color:var(--primary);">THỰC TRẠNG<br>DU LỊCH NHA TRANG</h1>
    <div class="accent-bar" style="margin-top:30px;"></div>
    <p style="margin:26px 0 0;font-size:var(--fs-h3);font-weight:500;line-height:1.4;color:var(--text-muted);">Tiềm năng nổi bật và những thách thức hiện nay</p>
  </div>

  <!-- Dot-track: chấm 2 active -->
  <div class="dot-track" style="position:absolute;left:72px;bottom:64px;z-index:10;">
    <span></span><span class="active"></span><span></span><span></span>
  </div>

</div>
</body>
</html>
