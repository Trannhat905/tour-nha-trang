<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Slide 02 — Thành viên nhóm</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FFFFFF; }
</style>
</head>
<body>
<div class="slide" style="padding:64px;display:flex;flex-direction:column;">

  <!-- Header -->
  <div>
    <span class="chip" style="font-size:20px;color:var(--primary);">NHÓM THỰC HIỆN</span>
    <h1 style="margin-top:24px;font-family:var(--font-heading);font-weight:900;font-size:var(--fs-h1);line-height:1.1;color:var(--primary);">Thành viên nhóm</h1>
    <div class="accent-bar" style="margin-top:18px;"></div>
  </div>

  <!-- Member grid -->
  <div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:42px;">

    <!-- 01 Kỳ Anh -->
    <div class="card-soft" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px;">
      <span style="position:absolute;top:20px;right:24px;font-size:var(--fs-small);font-weight:700;color:var(--accent-deep);">01</span>
      <div style="width:126px;height:126px;flex-shrink:0;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">
        <span style="font-size:var(--fs-h1);font-weight:800;color:var(--primary);line-height:1;">K</span>
      </div>
      <p style="margin-top:22px;font-size:30px;font-weight:800;color:var(--primary);text-align:center;white-space:nowrap;">Kỳ Anh</p>
      <p style="margin-top:8px;font-size:var(--fs-small);font-weight:500;color:var(--text-muted);">Thành viên nhóm</p>
    </div>

    <!-- 02 Minh Nhật -->
    <div class="card-soft" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px;">
      <span style="position:absolute;top:20px;right:24px;font-size:var(--fs-small);font-weight:700;color:var(--accent-deep);">02</span>
      <div style="width:126px;height:126px;flex-shrink:0;border-radius:50%;background:var(--accent-deep);display:flex;align-items:center;justify-content:center;">
        <span style="font-size:var(--fs-h1);font-weight:800;color:#FFFFFF;line-height:1;">M</span>
      </div>
      <p style="margin-top:22px;font-size:30px;font-weight:800;color:var(--primary);text-align:center;white-space:nowrap;">Minh Nhật</p>
      <p style="margin-top:8px;font-size:var(--fs-small);font-weight:500;color:var(--text-muted);">Thành viên nhóm</p>
    </div>

    <!-- 03 Anh Thư -->
    <div class="card-soft" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px;">
      <span style="position:absolute;top:20px;right:24px;font-size:var(--fs-small);font-weight:700;color:var(--accent-deep);">03</span>
      <div style="width:126px;height:126px;flex-shrink:0;border-radius:50%;background:var(--accent-deep);display:flex;align-items:center;justify-content:center;">
        <span style="font-size:var(--fs-h1);font-weight:800;color:#FFFFFF;line-height:1;">A</span>
      </div>
      <p style="margin-top:22px;font-size:30px;font-weight:800;color:var(--primary);text-align:center;white-space:nowrap;">Anh Thư</p>
      <p style="margin-top:8px;font-size:var(--fs-small);font-weight:500;color:var(--text-muted);">Thành viên nhóm</p>
    </div>

    <!-- 04 Thanh Nguyên -->
    <div class="card-soft" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px;">
      <span style="position:absolute;top:20px;right:24px;font-size:var(--fs-small);font-weight:700;color:var(--accent-deep);">04</span>
      <div style="width:126px;height:126px;flex-shrink:0;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">
        <span style="font-size:var(--fs-h1);font-weight:800;color:var(--primary);line-height:1;">T</span>
      </div>
      <p style="margin-top:22px;font-size:30px;font-weight:800;color:var(--primary);text-align:center;white-space:nowrap;">Thanh Nguyên</p>
      <p style="margin-top:8px;font-size:var(--fs-small);font-weight:500;color:var(--text-muted);">Thành viên nhóm</p>
    </div>

  </div>

</div>
</body>
</html>
