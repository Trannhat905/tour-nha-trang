<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>09 · Thách thức hiện nay</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  .challenge-card { display: flex; align-items: center; gap: 26px; padding: 26px 32px; }
  .challenge-icon { width: 78px; height: 78px; border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; flex: none; }
  .challenge-icon .material-icons { font-size: 40px; color: var(--primary); }
  .challenge-title { margin: 0; font-family: var(--font-heading); font-size: var(--fs-h3); font-weight: 800; line-height: 1.25; color: var(--primary); }
  .challenge-desc { margin: 7px 0 0; font-size: var(--fs-small); font-weight: 500; line-height: 1.35; color: var(--text-muted); }
</style>
</head>
<body>
<div class="slide" style="padding:60px 64px;display:flex;flex-direction:column;">

  <header style="flex:none;">
    <span class="chip-navy" style="font-size:var(--fs-small);">THÁCH THỨC</span>
    <h1 style="margin:20px 0 0;font-family:var(--font-heading);font-size:var(--fs-h1);font-weight:900;line-height:1.12;color:var(--primary);">Vấn đề cần lưu ý</h1>
    <div class="accent-bar" style="margin-top:18px;"></div>
  </header>

  <section style="flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:24px;margin-top:32px;">

    <div class="card challenge-card">
      <div class="challenge-icon"><span class="material-icons">groups</span></div>
      <div>
        <h3 class="challenge-title">Mùa cao điểm quá tải</h3>
        <p class="challenge-desc">Đông khách vào hè và dịp lễ</p>
      </div>
    </div>

    <div class="card challenge-card">
      <div class="challenge-icon"><span class="material-icons">compare_arrows</span></div>
      <div>
        <h3 class="challenge-title">Cạnh tranh mạnh</h3>
        <p class="challenge-desc">Nhiều điểm biển mới nổi lên</p>
      </div>
    </div>

    <div class="card challenge-card">
      <div class="challenge-icon"><span class="material-icons">payments</span></div>
      <div>
        <h3 class="challenge-title">Giá dịch vụ biến động</h3>
        <p class="challenge-desc">Tăng cao vào mùa du lịch</p>
      </div>
    </div>

    <div class="card challenge-card">
      <div class="challenge-icon"><span class="material-icons">category</span></div>
      <div>
        <h3 class="challenge-title">Sản phẩm chưa đa dạng</h3>
        <p class="challenge-desc">Cần làm mới trải nghiệm</p>
      </div>
    </div>

  </section>
</div>
</body>
</html>
