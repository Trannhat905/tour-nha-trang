<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Slide 04 — Phần 01: Mở đầu</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FFFFFF; }
</style>
</head>
<body>
<div class="slide" style="background:var(--primary);">

  <!-- decor: ghost chapter number -->
  <div data-decor aria-hidden="true" style="position:absolute;right:44px;top:50%;transform:translateY(-52%);font-family:var(--font-num);font-size:260px;font-weight:900;line-height:1;color:#FFFFFF;opacity:0.12;">01</div>

  <!-- decor: soft accent ring -->
  <div data-decor aria-hidden="true" style="position:absolute;right:-130px;bottom:-170px;width:420px;height:420px;border-radius:50%;border:3px solid var(--accent);opacity:0.18;"></div>

  <!-- Content -->
  <div style="position:absolute;left:96px;top:212px;z-index:10;">
    <span style="display:inline-flex;align-items:center;padding:10px 26px;border:2px solid var(--accent);border-radius:999px;color:var(--accent);font-weight:700;font-size:20px;letter-spacing:2px;">PHẦN 01 / 04</span>

    <h1 style="margin-top:34px;font-family:var(--font-heading);font-weight:900;font-size:var(--fs-display);line-height:1.05;color:#FFFFFF;">MỞ ĐẦU</h1>

    <div class="accent-bar" style="margin-top:28px;"></div>

    <p style="margin-top:26px;font-size:var(--fs-h3);font-weight:500;line-height:1.35;color:rgba(255,255,255,0.85);">Giới thiệu điểm đến Nha Trang và lý do chọn đề tài</p>
  </div>

  <!-- dot track -->
  <div class="dot-track" style="position:absolute;left:96px;bottom:76px;z-index:10;">
    <span class="active"></span>
    <span style="background:rgba(255,255,255,0.45);"></span>
    <span style="background:rgba(255,255,255,0.45);"></span>
    <span style="background:rgba(255,255,255,0.45);"></span>
  </div>

</div>
</body>
</html>
