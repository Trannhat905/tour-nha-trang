<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Slide 05 — Nha Trang: viên ngọc xanh của biển Đông</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FFFFFF; }
</style>
</head>
<body>
<div class="slide">

  <!-- LEFT 52% : text -->
  <div style="position:absolute;left:64px;top:56px;width:600px;z-index:10;">
    <span class="chip" style="font-size:20px;color:var(--primary);">GIỚI THIỆU</span>

    <h1 style="margin-top:20px;font-family:var(--font-heading);font-weight:900;font-size:var(--fs-h1);line-height:1.12;color:var(--primary);">Nha Trang<br>— viên ngọc xanh<br>của biển Đông</h1>

    <div class="accent-bar" style="margin-top:18px;"></div>

    <div style="margin-top:24px;display:flex;flex-direction:column;gap:20px;">
      <div style="display:flex;align-items:center;gap:18px;">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--accent-deep);display:flex;align-items:center;justify-content:center;flex:none;">
          <span class="material-icons" aria-hidden="true" style="font-size:26px;color:#FFFFFF;">location_on</span>
        </div>
        <p style="font-size:var(--fs-body);font-weight:600;line-height:1.3;color:var(--primary);">Thành phố biển tỉnh Khánh Hòa — miền Trung Việt Nam</p>
      </div>
      <div style="display:flex;align-items:center;gap:18px;">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--accent-deep);display:flex;align-items:center;justify-content:center;flex:none;">
          <span class="material-icons" aria-hidden="true" style="font-size:26px;color:#FFFFFF;">waves</span>
        </div>
        <p style="font-size:var(--fs-body);font-weight:600;line-height:1.3;color:var(--primary);">Vịnh Nha Trang — một trong những vịnh đẹp nhất thế giới</p>
      </div>
      <div style="display:flex;align-items:center;gap:18px;">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--accent-deep);display:flex;align-items:center;justify-content:center;flex:none;">
          <span class="material-icons" aria-hidden="true" style="font-size:26px;color:#FFFFFF;">wb_sunny</span>
        </div>
        <p style="font-size:var(--fs-body);font-weight:600;line-height:1.3;color:var(--primary);">Nắng ấm quanh năm — hơn 300 ngày nắng mỗi năm</p>
      </div>
    </div>

    <div style="margin-top:26px;">
      <span class="chip-navy" style="font-size:20px;">Biển xanh · Cát trắng · Nắng vàng</span>
    </div>
  </div>

  <!-- RIGHT 48% : image -->
  <div class="img-frame" style="position:absolute;top:28px;right:28px;bottom:28px;width:548px;z-index:10;">
    <img class="img-cover" src="https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/5fee4024041a.jpg" alt="Panorama thành phố biển Nha Trang">
  </div>

</div>
</body>
</html>
