<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kết luận — Những điều rút ra</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#FFFFFF; overflow:hidden; }
  .material-icons { line-height:1; }
  .sum-row { display:flex; align-items:center; gap:26px; padding:0 32px; flex:1; min-height:0; }
  .sum-icon { width:64px; height:64px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sum-icon .material-icons { font-size:32px; color:#FFFFFF; }
  .sum-text { font-size:var(--fs-body); font-weight:700; color:var(--primary); line-height:1.4; }
</style>
</head>
<body>
<div class="slide flex flex-col" style="padding:56px 64px;">

  <!-- Header -->
  <div class="shrink-0">
    <span class="chip" style="font-size:var(--fs-micro);">PHẦN 04 / 04 — KẾT LUẬN</span>
    <h1 style="font-family:var(--font-heading); font-size:var(--fs-h1); font-weight:800; line-height:1.1; color:var(--primary); margin-top:16px;">Những điều rút ra</h1>
    <div class="accent-bar" style="margin-top:14px;"></div>
  </div>

  <!-- 3 hàng kết luận -->
  <div class="flex flex-col flex-1 min-h-0" style="margin-top:28px; gap:18px;">

    <div class="card-soft sum-row">
      <div class="sum-icon"><span class="material-icons">location_city</span></div>
      <p class="sum-text" style="margin:0;">Nha Trang: điểm đến giàu tiềm năng, hút hàng chục triệu lượt khách mỗi năm</p>
    </div>

    <div class="card-soft sum-row">
      <div class="sum-icon"><span class="material-icons">route</span></div>
      <p class="sum-text" style="margin:0;">Tour 3N2Đ: hành trình đặc trưng — trọn gói ~4,2 triệu đồng/người, minh bạch từng khoản</p>
    </div>

    <div class="card-accent sum-row">
      <div class="sum-icon"><span class="material-icons">diversity_3</span></div>
      <p class="sum-text" style="margin:0;">Bài học: lập kế hoạch chi tiết và làm việc nhóm hiệu quả</p>
    </div>

  </div>
</div>
</body>
</html>
