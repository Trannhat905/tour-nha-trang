<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Slide 03 — Nội dung trình bày</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FFFFFF; }
</style>
</head>
<body>
<div class="slide" style="padding:64px;display:flex;flex-direction:column;">

  <!-- Header -->
  <div>
    <h1 style="font-family:var(--font-heading);font-weight:900;font-size:var(--fs-h1);line-height:1.1;color:var(--primary);">Nội dung trình bày</h1>
    <div class="accent-bar" style="margin-top:18px;"></div>
  </div>

  <!-- Agenda rows -->
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;margin-top:10px;">

    <!-- 01 -->
    <div class="card" style="display:flex;align-items:center;gap:26px;padding:14px 32px;min-height:106px;">
      <div class="num-badge" style="width:72px;height:72px;flex:none;background:var(--accent-deep);font-size:var(--fs-h2);">01</div>
      <div>
        <p style="font-size:var(--fs-h2);font-weight:800;line-height:1.15;color:var(--primary);">MỞ ĐẦU</p>
        <p style="margin-top:6px;font-size:var(--fs-small);font-weight:500;color:var(--text-muted);">Giới thiệu điểm đến &amp; lý do chọn đề tài</p>
      </div>
    </div>

    <!-- 02 -->
    <div class="card" style="display:flex;align-items:center;gap:26px;padding:14px 32px;min-height:106px;">
      <div class="num-badge" style="width:72px;height:72px;flex:none;background:var(--accent-deep);font-size:var(--fs-h2);">02</div>
      <div>
        <p style="font-size:var(--fs-h2);font-weight:800;line-height:1.15;color:var(--primary);">THỰC TRẠNG DU LỊCH NHA TRANG</p>
        <p style="margin-top:6px;font-size:var(--fs-small);font-weight:500;color:var(--text-muted);">Tiềm năng nổi bật &amp; thách thức hiện nay</p>
      </div>
    </div>

    <!-- 03 (nhấn mạnh) -->
    <div class="card-accent" style="display:flex;align-items:center;gap:26px;padding:14px 32px;min-height:106px;">
      <div class="num-badge" style="width:72px;height:72px;flex:none;background:var(--accent-deep);font-size:var(--fs-h2);">03</div>
      <div>
        <p style="font-size:var(--fs-h2);font-weight:800;line-height:1.15;color:var(--primary);">THIẾT KẾ TOUR</p>
        <p style="margin-top:6px;font-size:var(--fs-small);font-weight:500;color:var(--text-muted);">Lịch trình 3 ngày 2 đêm &amp; chi phí</p>
      </div>
    </div>

    <!-- 04 -->
    <div class="card" style="display:flex;align-items:center;gap:26px;padding:14px 32px;min-height:106px;">
      <div class="num-badge" style="width:72px;height:72px;flex:none;background:var(--accent-deep);font-size:var(--fs-h2);">04</div>
      <div>
        <p style="font-size:var(--fs-h2);font-weight:800;line-height:1.15;color:var(--primary);">KẾT LUẬN</p>
        <p style="margin-top:6px;font-size:var(--fs-small);font-weight:500;color:var(--text-muted);">Tổng kết đề tài &amp; đề xuất</p>
      </div>
    </div>

  </div>

</div>
</body>
</html>
