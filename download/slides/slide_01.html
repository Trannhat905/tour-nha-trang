<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Slide 01 — Bìa: Tour du lịch Nha Trang</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #FFFFFF; }
</style>
</head>
<body>
<div class="slide">

  <!-- decor: soft band bottom-left -->
  <div data-decor aria-hidden="true" style="position:absolute;left:0;bottom:0;width:660px;height:188px;background:var(--bg-soft);border-radius:0 84px 0 0;"></div>

  <!-- LEFT 55% : text -->
  <div style="position:absolute;left:64px;top:64px;width:604px;z-index:10;">
    <span class="chip" style="font-size:20px;color:var(--primary);">BÀI THUYẾT TRÌNH NHÓM</span>

    <h1 style="margin-top:30px;font-family:var(--font-heading);font-weight:900;font-size:var(--fs-display);line-height:1.04;letter-spacing:-0.025em;color:var(--primary);">
      TOUR DU LỊCH<br><span style="color:var(--accent-deep);">NHA TRANG</span>
    </h1>

    <div class="accent-bar" style="margin-top:26px;"></div>

    <p style="margin-top:22px;font-size:var(--fs-h3);font-weight:500;line-height:1.35;color:var(--text-muted);">Khám phá viên ngọc xanh của biển Đông</p>

    <div style="margin-top:30px;display:inline-flex;align-items:center;gap:12px;background:var(--primary);color:#FFFFFF;border-radius:999px;padding:13px 30px;font-weight:700;font-size:var(--fs-small);letter-spacing:1px;">
      <span class="material-icons" aria-hidden="true" style="font-size:24px;color:var(--accent);">event</span>
      <span>3 NGÀY 2 ĐÊM</span>
    </div>
  </div>

  <!-- members line -->
  <p style="position:absolute;left:64px;bottom:58px;z-index:10;font-size:var(--fs-small);font-weight:500;color:var(--text-muted);">Thành viên: Kỳ Anh · Minh Nhật · Anh Thư · Thanh Nguyên</p>

  <!-- RIGHT 45% : image -->
  <div class="img-frame" style="position:absolute;top:28px;right:28px;bottom:28px;width:540px;z-index:10;">
    <img class="img-cover" src="https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/28a28755af7e.jpg" alt="Toàn cảnh bãi biển Nha Trang nhìn từ trên cao">
  </div>

</div>
</body>
</html>
