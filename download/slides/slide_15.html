<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cảm ơn — Q &amp; A</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#FFFFFF; overflow:hidden; }
  .material-icons { line-height:1; }
  .chip-qa {
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 30px; border-radius:999px;
    border:2px solid var(--accent); color:var(--accent);
    font-weight:700; letter-spacing:4px; font-size:var(--fs-small);
    background:transparent;
  }
  .deco { position:absolute; border-radius:50%; pointer-events:none; }
</style>
</head>
<body>
<div class="slide" style="background:var(--primary); padding:64px;">

  <!-- Trang trí: hình tròn mờ màu accent ở góc -->
  <div class="deco" data-decor aria-hidden="true" style="width:460px; height:460px; top:-170px; right:-150px; background:var(--accent); opacity:0.16;"></div>
  <div class="deco" data-decor aria-hidden="true" style="width:120px; height:120px; top:110px; right:300px; background:var(--accent); opacity:0.10;"></div>
  <div class="deco" data-decor aria-hidden="true" style="width:340px; height:340px; bottom:-140px; left:-120px; background:var(--accent); opacity:0.13;"></div>
  <div class="deco" data-decor aria-hidden="true" style="width:90px; height:90px; bottom:120px; left:280px; border:3px solid var(--accent); opacity:0.22; background:transparent;"></div>

  <!-- Nội dung căn giữa -->
  <div class="relative z-10 flex flex-col items-center justify-center text-center" style="height:100%;">
    <span class="chip-qa">Q &amp; A</span>
    <h1 style="font-family:var(--font-heading); font-size:var(--fs-display); font-weight:900; color:#FFFFFF; line-height:1.12; margin-top:30px;">CẢM ƠN<br>THẦY CÔ VÀ CÁC BẠN!</h1>
    <div class="accent-bar" style="margin-top:26px;"></div>
    <p style="font-size:var(--fs-h3); font-weight:500; color:rgba(255,255,255,0.85); margin-top:24px;">Rất mong nhận được câu hỏi và góp ý</p>
    <p style="font-size:var(--fs-small); color:rgba(255,255,255,0.7); margin-top:44px;">Nhóm thực hiện: Kỳ Anh · Minh Nhật · Anh Thư · Thanh Nguyên</p>
  </div>

</div>
</body>
</html>
