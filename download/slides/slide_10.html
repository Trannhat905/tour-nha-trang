<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>10 · Phần 03 — Thiết kế tour</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  .dot-track span { background: rgba(255, 255, 255, 0.35); }
  .dot-track span.active { background: var(--accent); }
</style>
</head>
<body>
<div class="slide" style="background:var(--primary);">

  <!-- Số chương khổng lồ mờ, góc phải (trang trí) -->
  <div data-decor aria-hidden="true" style="position:absolute;right:44px;top:50%;transform:translateY(-50%);z-index:1;font-family:var(--font-heading);font-weight:900;font-size:260px;line-height:1;color:#FFFFFF;opacity:0.12;user-select:none;">03</div>

  <!-- Khối nội dung căn giữa dọc -->
  <div style="position:absolute;left:72px;top:50%;transform:translateY(-50%);z-index:10;max-width:1030px;">
    <span style="display:inline-flex;align-items:center;padding:9px 24px;border-radius:999px;border:2px solid var(--accent);color:var(--accent);font-weight:700;letter-spacing:2px;font-size:var(--fs-small);">PHẦN 03 / 04</span>
    <h1 style="margin:30px 0 0;font-family:var(--font-heading);font-size:var(--fs-display);font-weight:900;line-height:1.05;letter-spacing:-1px;color:#FFFFFF;">THIẾT KẾ TOUR</h1>
    <p style="margin:16px 0 0;font-family:var(--font-heading);font-size:var(--fs-h2);font-weight:700;letter-spacing:3px;color:var(--accent);">3 NGÀY 2 ĐÊM</p>
    <div class="accent-bar" style="margin-top:28px;"></div>
    <p style="margin:26px 0 0;font-size:var(--fs-h3);font-weight:500;line-height:1.4;color:rgba(255,255,255,0.85);">Lịch trình — Điểm đến — Chi phí</p>
  </div>

  <!-- Dot-track: chấm 3 active -->
  <div class="dot-track" style="position:absolute;left:72px;bottom:64px;z-index:10;">
    <span></span><span></span><span class="active"></span><span></span>
  </div>

</div>
</body>
</html>
